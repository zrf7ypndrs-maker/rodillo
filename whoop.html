<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodillo · Connect WHOOP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<link rel="stylesheet" href="css/app.css?v=202611090130">
<style>
  .wrap { max-width: 640px; margin: 48px auto; padding: 0 20px; }
  .card { margin-bottom: 14px; }
  .card p, .card li { font-size: 14.5px; line-height: 1.55; color: var(--muted); }
  .card b { color: var(--text); }
  input { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 15px; margin: 8px 0 12px; }
  .code { font: 600 15px ui-monospace, Menlo, monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; word-break: break-all; margin: 10px 0; color: var(--text); }
  .err { color: var(--bad); }
  ol { padding-left: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand" style="margin-bottom:22px"><span class="logo"></span>Rodillo · WHOOP</div>
  <div id="main"></div>
  <p class="muted" style="font-size:12.5px">This page only sends you to WHOOP to approve access. The access code goes into a GitHub workflow in your private rodillo-data repo, which keeps the WHOOP keys in encrypted repository secrets.</p>
</div>
<script>
  const REDIRECT = 'https://zrf7ypndrs-maker.github.io/rodillo/whoop.html';
  const WORKFLOW = 'https://github.com/zrf7ypndrs-maker/rodillo-data/actions/workflows/whoop.yml';
  const SCOPES = 'offline read:recovery read:sleep read:cycles';
  const main = document.getElementById('main');
  const q = new URLSearchParams(location.search);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  if (q.get('error')) {
    main.innerHTML = `<div class="card"><h3 class="err">WHOOP said no</h3><p>${esc(q.get('error_description') || q.get('error'))}</p><p><a href="whoop.html">Try again</a></p></div>`;
  } else if (q.get('code')) {
    const okState = q.get('state') && q.get('state') === sessionStorage.getItem('whoopState');
    main.innerHTML = `<div class="card">
      <h3>Approved. One last step</h3>
      ${okState ? '' : '<p class="err">Warning: the security check (state) did not match. Only continue if you just clicked Authorize on this page.</p>'}
      <p>Copy this code. It expires in a few minutes:</p>
      <div class="code" id="code">${esc(q.get('code'))}</div>
      <button class="primary" id="copy">Copy code</button>
      <ol>
        <li>Open the <a href="${WORKFLOW}" target="_blank" rel="noopener"><b>WHOOP sync workflow</b></a>.</li>
        <li>Click <b>Run workflow</b> (right side), paste the code into the box, click the green <b>Run workflow</b>.</li>
        <li>About 30 seconds later it turns green. From then on it syncs by itself every morning.</li>
      </ol></div>`;
    document.getElementById('copy').onclick = async (e) => { await navigator.clipboard.writeText(q.get('code')); e.target.textContent = 'Copied'; };
  } else {
    main.innerHTML = `<div class="card">
      <h3>Connect WHOOP</h3>
      <p>Paste the <b>Client ID</b> of the app you created at developer.whoop.com (the ID is not secret; keep the Client Secret for GitHub).</p>
      <input id="cid" placeholder="Client ID" autocomplete="off" value="${esc(localStorage.getItem('rodillo.whoopClientId') || '')}">
      <button class="primary" id="go">Authorize with WHOOP</button></div>`;
    document.getElementById('go').onclick = () => {
      const cid = document.getElementById('cid').value.trim();
      if (!cid) return;
      localStorage.setItem('rodillo.whoopClientId', cid);
      const state = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
      sessionStorage.setItem('whoopState', state);
      const url = new URL('https://api.prod.whoop.com/oauth/oauth2/auth');
      url.search = new URLSearchParams({ response_type: 'code', client_id: cid, redirect_uri: REDIRECT, scope: SCOPES, state });
      location.href = url;
    };
  }
</script>
</body>
</html>
